<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- hyprscope plugin icon: the user's screen, with the agent's pointer on it.
       The screen is what the agent observes; the pointer is the action it takes,
       and every action still waits for the host's consent card. -->
  <rect x="4.75" y="5.5" width="26.5" height="17.5" rx="2.8" stroke="#679EFE" stroke-width="2.5" />
  <path d="M18 23.25V26.25" stroke="#679EFE" stroke-width="2.5" stroke-linecap="round" />
  <path d="M13 28H23" stroke="#679EFE" stroke-width="2.5" stroke-linecap="round" />
  <path d="M14.2 7.6 26.6 12.2 21.1 14.3 24 20 21.7 21.1 18.9 15.3 14.9 18.4 Z" fill="url(#hyprscope-pointer)" />
  <defs>
    <linearGradient id="hyprscope-pointer" x1="15.5" y1="8.2" x2="24" y2="20.2" gradientUnits="userSpaceOnUse">
      <stop stop-color="#86B8F5" />
      <stop offset="1" stop-color="#5269E1" />
    </linearGradient>
  </defs>
</svg>
